# The URL the site will be built for
base_url = "https://rafaeruscorner.xyz/"
# base_url = "http://127.0.0.1:1111/"
title = "Rafaeru's corner"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Enable RSS/Atom generation
generate_feeds = true

taxonomies = [
    {name = "tags"},
]

[markdown.highlighting]
# Syntax highlighting theme (Zola 0.23+ requires one to be set)
theme = "nord"

[extra]
# Put all your custom variables here

socials = [
  { name = "RSS", url = "/atom.xml" },
  { name = "GitLab", url = "https://gitlab.com/rinuxu" },
  { name = "LinkedIn", url = "https://www.linkedin.com/in/rafael-jose-rodriguez/" },
]

user = "rafa"

# Shown as F-key entries in the top bar: "F1 ホーム Home"
menu = [
  { name = "Home", jp = "ホーム", url = "/" },
  { name = "Blog", jp = "ブログ", url = "/blog" },
  { name = "Code", jp = "コード", url = "/projects" },
  { name = "Contact", jp = "連絡", url = "/contact" },
  { name = "Tags", jp = "タグ", url = "/tags" },
]
